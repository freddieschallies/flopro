name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor and sync
        working-directory: android-app
        run: |
          npm ci
          npx cap sync android

      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.FLOPRO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/flopro.jks"
            echo "file=$RUNNER_TEMP/flopro.jks" >> "$GITHUB_OUTPUT"
            echo "Signing with the FloPro release key"
          else
            echo "::warning::No FLOPRO_KEYSTORE_BASE64 secret - building a debug-signed test APK. Phones can't update this over a release-signed install."
          fi

      - name: Build APK
        working-directory: android-app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          FLOPRO_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          FLOPRO_KEYSTORE_PASSWORD: ${{ secrets.FLOPRO_KEYSTORE_PASSWORD }}
          FLOPRO_KEY_ALIAS: ${{ secrets.FLOPRO_KEY_ALIAS }}
          FLOPRO_KEY_PASSWORD: ${{ secrets.FLOPRO_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$FLOPRO_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/FloPro-Jobs.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FloPro-Jobs.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: FloPro-Jobs-apk
          path: FloPro-Jobs.apk

      - name: Publish as a GitHub release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: FloPro Jobs APK 1.0.${{ github.run_number }}
          body: |
            Android app for FloPro Plumbing job cards.
            Download **FloPro-Jobs.apk** on the phone and open it to install.
            The app itself updates automatically from the website - you only need a new APK if the Android shell changes.
          files: FloPro-Jobs.apk
          make_latest: true
