name: Build Android APK

# Every push to main builds a new APK and publishes it as the latest GitHub release.
# The app checks that release when it opens and offers "Update now".
on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build the app into the APK's web folder
        run: |
          python3 scripts/build.py "$VERSION_NAME"
          mkdir -p android-app/www
          cp -r index.html manifest.webmanifest icons android-app/www/

      - name: Install Capacitor and sync
        working-directory: android-app
        run: |
          npm ci
          npx cap sync android

      - name: Build signed APK
        working-directory: android-app/android
        env:
          FLOPRO_KEYSTORE_PASSWORD: ${{ secrets.FLOPRO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$FLOPRO_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the FLOPRO_KEYSTORE_PASSWORD secret (Settings > Secrets and variables > Actions) so the APK is signed with the FloPro key."
            exit 1
          fi
          export FLOPRO_KEYSTORE_FILE="$GITHUB_WORKSPACE/android-app/signing/flopro-release.jks"
          export FLOPRO_KEY_ALIAS=flopro
          export FLOPRO_KEY_PASSWORD="$FLOPRO_KEYSTORE_PASSWORD"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/FloPro-Jobs.apk"

      - name: Version file the app checks for updates
        run: |
          echo "{\"code\": ${VERSION_CODE}, \"version\": \"${VERSION_NAME}\", \"apk\": \"https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-v${VERSION_NAME}/FloPro-Jobs.apk\"}" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: FloPro-Jobs-apk
          path: FloPro-Jobs.apk

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ env.VERSION_NAME }}
          name: FloPro Jobs ${{ env.VERSION_NAME }}
          body: |
            FloPro Plumbing job cards app.
            Download **FloPro-Jobs.apk** on the phone and open it to install.
            Phones that already have the app get an "Update now" message - jobs, customers and invoices are kept.
          files: |
            FloPro-Jobs.apk
            version.json
          make_latest: true
