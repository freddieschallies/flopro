<style>
/* VOICE: a plumber's work tool — plain, sturdy, big thumbs, no fuss.
   IDEA: the FloPro van door: navy panel, white house-and-tap mark.
   PICTURE: the job list itself; documents render as real A4 paper.
   COLOUR and TYPE: FloPro navy #09396a, white, one water-blue accent; Exo 2 titles, Open Sans body/paper.
   LAYOUT: one column, sticky navy header, bottom tab bar, big action buttons. */
:root{color-scheme:light dark;--navy:#09396a;--navy2:#0e4d8e;--sky:#2f9ad8;
--bg:light-dark(#eef2f6,#0b1522);--card:light-dark(#fff,#13233a);--ink:light-dark(#13233a,#e7eef7);
--mute:light-dark(#5b6a7d,#9fb0c4);--line:light-dark(#d6dde6,#26384f);--field:light-dark(#f7f9fb,#0f1d31)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Open Sans",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Exo 2",system-ui,sans-serif;margin:0;line-height:1.1}
header.app{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:12px}
header.app img{width:42px;height:42px;border-radius:9px}
header.app .nm{font-family:"Exo 2",system-ui,sans-serif;font-weight:800;font-size:20px;letter-spacing:.5px}
header.app .tg{font-size:12px;opacity:.8}
header.app .gear{margin-left:auto;background:none;border:0;color:#fff;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
header.app .gear svg{width:26px;height:26px}header.app .gear.on{background:rgba(255,255,255,.18)}
.gal h3{font-size:16px;margin:18px 0 8px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.gal h3 small{font:600 13px "Open Sans";color:var(--mute);white-space:nowrap}
.gal .gg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.gal .gg button{aspect-ratio:1;border:0;padding:0;background:var(--line);border-radius:6px;overflow:hidden;cursor:pointer}
.gal .gg img{width:100%;height:100%;object-fit:cover;display:block}
@media(min-width:600px){.gal .gg{grid-template-columns:repeat(5,minmax(0,1fr))}}
.ov .cap{color:#fff;text-align:center;font-size:15px}.ov .cap b{display:block;font-size:17px}
main{max-width:780px;margin:0 auto;padding:16px 14px calc(110px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:none;border:0;color:var(--mute);font:600 12px/1.2 "Open Sans";text-align:center;padding:9px 2px 10px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button.on{color:var(--sky)}
nav.tabs svg{width:24px;height:24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.top h1{font-size:30px}
.btn{appearance:none;border:0;border-radius:12px;background:var(--navy);color:#fff;font:700 16px "Open Sans";padding:12px 18px;min-height:48px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
:root[data-theme=dark] .btn,.btn{}
.btn.sky{background:var(--sky)}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:#c0392b}.btn.green{background:#1e8e4f}.btn.sm{min-height:40px;padding:8px 14px;font-size:14px}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:19px;margin-bottom:12px;color:var(--ink)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:10px}
input,textarea,select{width:100%;font:16px "Open Sans",sans-serif;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:4px;min-height:46px}
textarea{min-height:84px;resize:vertical}
input[type=search]{margin:0 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;font:600 14px "Open Sans";min-height:40px;cursor:pointer}

.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;color:var(--ink);font:inherit;cursor:pointer}

.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.photos .ph{border:0}.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos label svg{width:30px;height:30px;margin-bottom:4px}
.photos input{display:none}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--field)}
.item .r1{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px}

.item select{background:var(--card);margin-top:2px;padding:8px}
.item .r3{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.item .lnk{background:none;border:0;color:#c0392b;font:600 14px "Open Sans";min-height:40px;cursor:pointer}
.mkrow{display:grid;grid-template-columns:minmax(0,1fr) 96px auto;gap:8px;align-items:center;margin-bottom:8px}.mkrow input{margin:0}.pct{display:flex;align-items:center;gap:4px}.pct span{font-weight:700}
.mkrow .lnk,.lnk{background:none;border:0;color:#c0392b;font:600 14px "Open Sans";min-height:40px;cursor:pointer}
.tot{display:flex;justify-content:space-between;align-items:center;font-size:18px;padding:6px 2px}
.acts{display:grid;gap:10px}
.mute{color:var(--mute);font-size:14px}
.stat{display:flex;gap:12px;margin-bottom:14px}
.stat>div{flex:1;background:var(--navy);color:#fff;border-radius:14px;padding:12px 14px}
.stat b{display:block;font:800 clamp(20px,6vw,26px) "Exo 2",system-ui,sans-serif;white-space:nowrap}
.stat span{font-size:13px;opacity:.85}
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,15,30,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
.ov img{max-width:100%;max-height:75vh;border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#13233a;color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:60;font-size:14px;max-width:90vw;text-align:center}
.pwrap{overflow:hidden;border-radius:6px;box-shadow:0 4px 24px rgba(0,0,0,.18);background:#fff;margin-bottom:14px}
.pwrap .paper{transform-origin:0 0}
#printHost{display:none}
.upd{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 70px);z-index:40;background:var(--sky);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:560px;margin:0 auto}
.upd span{flex:1;font-weight:600;font-size:15px}.upd .btn{background:#fff;color:var(--navy)}
/* ---------- A4 paper (matches FloPro's Zoho invoice) ---------- */
.paper{width:794px;min-height:1123px;background:#fff;color:#222;font:12px/1.5 "Open Sans",Arial,sans-serif;padding:44px 58px 34px;display:flex;flex-direction:column}
.paper *{color:inherit}
.p-top{display:flex;justify-content:space-between;align-items:flex-start}
.p-logo{width:210px;height:200px;background:#f0f0f4;display:flex;align-items:center;justify-content:center}
.p-logo img{width:176px}
.p-title{text-align:right}
.p-h{font-size:36px;line-height:1.1;font-weight:400;color:#111}
.p-no{font-weight:700;font-size:12px;margin-top:2px}
.p-bl{font-weight:700;font-size:11px;margin-top:26px}
.p-bal{font-weight:700;font-size:18px}
.p-co{margin-top:10px;font-size:12px;line-height:1.55}
.p-co b{font-size:12.5px}
.p-mid{display:flex;justify-content:space-between;align-items:flex-end;margin-top:22px;gap:20px}
.p-to{font-size:12px;line-height:1.55}
.p-to .bt{color:#555;font-size:11px}
.p-meta{border-collapse:collapse;font-size:12px}
.p-meta td{padding:5px 0 5px 20px;text-align:right;white-space:nowrap}
.p-meta td:first-child{color:#333}
.p-meta td:last-child{min-width:150px}
.p-sub{margin-top:22px;font-size:12px}
.p-items{width:100%;border-collapse:collapse;margin-top:16px;font-size:12px}
.p-items th{background:#3c3d3a;color:#fff;font-weight:400;padding:9px 10px;text-align:left}
.p-items th.n,.p-items td.n{text-align:right}
.p-items td{padding:12px 10px;vertical-align:top;border-bottom:1px solid #cfcfcf}
.p-items .d{color:#444;font-size:11.5px;white-space:pre-line}
.p-items .u{font-size:10px;color:#444}
.p-tot{margin-left:auto;width:340px;margin-top:6px;font-size:12px}
.p-tot>div{display:flex;justify-content:space-between;padding:10px 12px}
.p-tot .b{font-weight:700}
.p-tot .hl{background:#f3f3f2;font-weight:700;padding:14px 12px}
.p-notes{margin-top:28px;font-size:11.5px;white-space:pre-line;line-height:1.6}
.p-terms{margin-top:16px;font-size:11.5px;white-space:pre-line;line-height:1.6;text-transform:uppercase}
.p-foot{margin-top:auto;padding-top:14px;border-top:1px solid #bbb;font-size:11px;white-space:pre-line;line-height:1.6}
.p-stamp{display:inline-block;border:3px solid #1e8e4f;color:#1e8e4f;font:800 22px "Open Sans";padding:2px 14px;transform:rotate(-8deg);margin-top:12px;letter-spacing:2px}
.p-sec{margin-top:18px}.p-sec h4{margin:0 0 4px;font-size:12px;background:#3c3d3a;color:#fff;font-weight:600;padding:6px 10px}
.p-sec div{white-space:pre-line;padding:6px 10px;min-height:36px}
.p-ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.p-ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.p-sig{display:flex;gap:40px;margin-top:40px}.p-sig div{flex:1;border-top:1px solid #333;padding-top:4px;font-size:11px}
@media(max-width:420px){.top h1{font-size:26px}}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  header.app,nav.tabs,main,.toast,.ov{display:none!important}
  #printHost{display:block}
  .paper{min-height:286mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .p-sec h4,.p-items th,.p-tot .hl,.p-logo{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(prefers-reduced-motion:no-preference){.row{transition:transform .12s}.row:active{transform:scale(.985)}}
</style>

<script>
{
const LOGO="__LOGO__", ICON="__ICON__", BUILD="__BUILD__";
const STATUS=['New','Quoted','In progress','Done','Invoiced','Paid'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DEF={name:'FLOPRO PLUMBING',addr:'LOT 20\nREGIA STREET KWAMBONAMBI',phone:'0605198480',email:'',
 legal:'BARRY JOHN RATTRAY T/A\nFLOPRO PLUMBING CK NO.: 2019/179401/07',
 bank:'BANK: ABSA / BRANCH: RICHARDS BAY / CODE: 632005 / ACC. NO.: 4115325486',
 notes:'FloPro Plumbing accepts no responsibility for any underground water mains, electrical or fiber lines not indicated on plans or neither by client whilst excavation is taking place.  COC  to be issued once payment received in full',
 terms:'Quote payable in full in order for works to be scheduled.\nErrors and omissions are excluded.\nOver and above works will be quoted for accordingly.\nThank you for your business.',
 invPrefix:'IN',invNext:100728,qtPrefix:'QT-',qtNext:1,jcPrefix:'JC',jcNext:1,payTerms:'Due on Receipt',quoteDays:14,kmRate:'',travelRate:'',
 markups:[{id:'parts',name:'Parts & materials',pct:30},{id:'labour',name:'Labour',pct:0}]};
const S={settings:{...DEF},jobs:[],docs:[],customers:[],stock:[],sq:'',gq:'',cq:'',view:'jobs',id:null,q:'',filter:'All',dfilter:'invoice',pc:{}};
const main=document.getElementById('main');

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n};
const money=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const addDays=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return iso(x)};
const fdate=d=>{if(!d)return'';const [y,m,dd]=d.split('-');return `${dd} ${MON[+m-1]} ${y}`};
const total=items=>(items||[]).reduce((a,i)=>a+num(i.qty)*num(i.rate),0);
const clone=o=>JSON.parse(JSON.stringify(o));
const cls=s=>String(s).replace(/\s+/g,'-');
const job=id=>S.jobs.find(j=>j.id===id);
const doc=id=>S.docs.find(d=>d.id===id);
const cust=id=>S.customers.find(c=>c.id===id);
const byName=n=>{n=String(n||'').trim().toLowerCase();return n&&S.customers.find(c=>c.name.trim().toLowerCase()===n)};
const CF=['phone','email','address'];
function linkCust(j,c){j.custId=c.id;j.cust=c.name;for(const k of CF)j[k]=c[k]||'';save('jobs')}
function upsertFromJob(j){if(!j.cust.trim())return;let c=j.custId&&cust(j.custId);
 if(c&&c.name.trim().toLowerCase()===j.cust.trim().toLowerCase())return c;
 const ex=byName(j.cust);if(ex){for(const k of CF)if(!j[k]&&ex[k])j[k]=ex[k];for(const k of CF)if(!ex[k]&&j[k])ex[k]=j[k];j.custId=ex.id;save('customers');save('jobs');return ex}
 c={id:uid(),name:j.cust.trim(),phone:j.phone,email:j.email,address:j.address,notes:'',added:today()};S.customers.push(c);j.custId=c.id;save('customers');save('jobs');toast(`${c.name} saved to customers`);return c}
let tt;function toast(m){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);clearTimeout(tt);tt=setTimeout(()=>t.remove(),2600)}

/* ---------- storage (IndexedDB on this phone) ---------- */
/* Native FloPro plugin (APK only). Talks straight to Capacitor's bridge, which has no registerPlugin without a bundler. */
let natP;const native=()=>{if(natP)return natP;const C=window.Capacitor;
 if(!C?.isNativePlatform?.()||!C.nativePromise)return null;
 natP={print:o=>C.nativePromise('FloPro','print',o||{}),shareFile:o=>C.nativePromise('FloPro','shareFile',o||{}),info:()=>C.nativePromise('FloPro','info',{}),
  getText:o=>C.nativePromise('FloPro','getText',o||{}),canInstall:()=>C.nativePromise('FloPro','canInstall',{}),installUpdate:o=>C.nativePromise('FloPro','installUpdate',o||{}),

const mem=new Map();let idb=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('flopro-jobcards',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{idb=r.result;res()};r.onerror=()=>res();r.onblocked=()=>res()}catch(e){res()}})}
function tx(mode,fn){return new Promise((res,rej)=>{const t=idb.transaction('kv',mode),r=fn(t.objectStore('kv'));t.oncomplete=()=>res(r?.result);t.onerror=()=>rej(t.error)})}
async function get(k){if(idb)try{return await tx('readonly',s=>s.get(k))}catch(e){}return mem.get(k)}
async function put(k,v){mem.set(k,v);if(idb)try{await tx('readwrite',s=>s.put(v,k))}catch(e){toast('Could not save — phone storage full?')}}
async function del(k){mem.delete(k);if(idb)try{await tx('readwrite',s=>s.delete(k))}catch(e){}}
async function allKeys(){if(idb)try{return await tx('readonly',s=>s.getAllKeys())}catch(e){}return[...mem.keys()]}
const timers={};
function save(what){clearTimeout(timers[what]);timers[what]=setTimeout(()=>{delete timers[what];put(what,S[what])},300)}
async function flush(){for(const w of Object.keys(timers)){clearTimeout(timers[w]);delete timers[w];await put(w,S[w])}}
const saveAll=()=>{save('stock');save('customers');save('jobs');save('docs');save('settings')};

 im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}

/* ---------- auto update ----------
   APK: checks GitHub releases for a newer FloPro-Jobs.apk, downloads it and opens Android's installer.
   Website (if ever hosted): checks version.json and reloads. Saved data is never touched. */
const REPO='freddieschallies/flopro';
const isNative=()=>!!native();
const inApp=()=>isNative()||/^https?:\/\/localhost$/.test(location.origin)&&!!window.androidBridge;
const isLive=()=>!inApp()&&!BUILD.startsWith('__')&&(location.protocol==='https:'||location.hostname==='localhost')&&window.self===window.top;
let swReg=null,updShown=false,upd=null,lastCheck=0,appInfo=null;
async function info(){if(appInfo)return appInfo;try{appInfo=await native().info()}catch(e){appInfo={version:'?',build:0}}return appInfo}
async function checkUpdate(manual){
 if(!manual&&Date.now()-lastCheck<10*60*1000)return;lastCheck=Date.now();
 if(isNative()){const me=await info(),nat=native();let n=0,url='',why='';
  try{const r=await nat.getText({url:`https://github.com/${REPO}/releases/latest/download/version.json`});
   if(r.status===200){const v=JSON.parse(r.text);n=+v.code;url=v.apk}}catch(e){why='offline'}
  if(!n&&why!=='offline'){try{const r=await nat.getText({url:`https://api.github.com/repos/${REPO}/releases/latest`});
   if(r.status===200){const rel=JSON.parse(r.text),a=(rel.assets||[]).find(x=>/\.apk$/i.test(x.name));n=parseInt(String(rel.tag_name).split('.').pop());url=a?.browser_download_url}
   else why=r.status===403||r.status===429?'busy':'github'}catch(e){why='offline'}}
  if(n&&url){if(n>+me.build){upd={url,ver:'1.0.'+n};showUpdate(`New version ${upd.ver} is ready.`)}else if(manual)toast(`You have the latest version (${me.version})`)}
  else if(manual)toast(why==='offline'?'No internet — connect and try again':why==='busy'?'GitHub is busy — try again in a little while':'Could not check for updates — try again later');
  return}
 if(!isLive()){if(manual)toast(inApp()?'Could not reach the app’s update service — reopen the app and try again':'Updates come through the FloPro Plumbing app');return}
 try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});const v=await r.json();
  if(v.build&&v.build!==BUILD){const busy=['job','doc','cust','jobcard','part'].includes(S.view)||document.querySelector('.ov');if(busy||manual)showUpdate('A new version of the app is ready.');else applyUpdate()}
  else if(manual)toast('You have the latest version')}catch(e){if(manual)toast('No internet — try again later')}}
function showUpdate(msg){let d=document.querySelector('.upd');if(!d){d=document.createElement('div');d.className='upd';d.innerHTML='<span></span><button class="btn sm">Update now</button>';d.querySelector('button').onclick=applyUpdate;document.body.append(d)}d.querySelector('span').textContent=msg;updShown=true}
async function applyUpdate(){await flush();
 if(isNative()&&upd){const d=document.querySelector('.upd'),b=d?.querySelector('button'),s=d?.querySelector('span');if(b)b.disabled=true;if(s)s.textContent='Downloading update…';
  const h=await native().addListener('updateProgress',p=>{if(s)s.textContent=`Downloading update… ${p.pct}%`});
  try{await native().installUpdate({url:upd.url});if(s)s.textContent='Tap Install on the next screen. Your jobs and invoices are kept.'}
  catch(e){const m=String(e?.message||e);if(s)s.textContent=m.includes('NEED_PERMISSION')?'Allow FloPro Jobs to install apps, then come back and tap Update now.':'Download failed — check internet and try again.'}
  finally{if(b)b.disabled=false;h?.remove?.()}return}
 toast('Updating…');try{if(swReg)await swReg.update();if(window.caches)for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.reload()}
if(isLive()&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>swReg=r).catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
setInterval(()=>checkUpdate(),30*60*1000);
addEventListener('pagehide',()=>{flush()});

/* one-off: Parts and Materials became one "Parts & materials" markup */
function mergeMaterials(){const ms=S.settings.markups||[];if(!ms.some(m=>m.id==='materials'))return;
 const p=ms.find(m=>m.id==='parts');if(p&&p.name==='Parts')p.name='Parts & materials';
 S.settings.markups=ms.filter(m=>m.id!=='materials');if(!S.settings.markups.some(m=>m.id==='parts'))S.settings.markups.unshift({id:'parts',name:'Parts & materials',pct:30});
 S.stock.forEach(s=>{if(s.grp==='materials')s.grp='parts'});S.jobs.forEach(j=>(j.items||[]).forEach(i=>{if(i.grp==='materials')i.grp='parts'}));saveAll()}
/* ---------- start ---------- */
function migrate(jobs){const out=[];for(const j of jobs){if(!j.cust?.trim())continue;let c=out.find(x=>x.name.trim().toLowerCase()===j.cust.trim().toLowerCase());
 if(!c){c={id:uid(),name:j.cust.trim(),phone:'',email:'',address:'',notes:'',added:j.date||today()};out.push(c)}for(const k of CF)if(!c[k]&&j[k])c[k]=j[k];j.custId=c.id}return out}
(async()=>{await openDB();try{navigator.storage?.persist?.()}catch(e){}
 S.settings={...DEF,...(await get('settings')||{})};S.jobs=await get('jobs')||[];S.docs=await get('docs')||[];S.customers=await get('customers')||migrate(S.jobs);S.stock=await get('stock')||migrateStock();save('stock');mergeMaterials();save('customers');save('jobs');render();checkUpdate()})();
}
